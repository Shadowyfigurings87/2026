rule_files:
  - "backend/observatory/prometheus_alerts.yml"

groups:
  - name: rf_observatory_alerts
    interval: 30s
    rules:
      - alert: LowRSSI
        expr: rssi_avg < -85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Average RSSI is too low"
          description: "RSSI average has dropped below -85 for more than 2 minutes."

      - alert: HighAnomalyScore
        expr: anomaly_score > 0.8
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High anomaly score detected"
          description: "Anomaly score exceeded 0.8 for at least 1 minute."

      - alert: NoFramesReceived
        expr: increase(frames_total[5m]) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No frames received"
          description: "No frames have been ingested in the last 5 minutes."
