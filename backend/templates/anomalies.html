{% extends "base.html" %}
{% block content %}

<style>
    .anomaly-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 20px;
    }

    .panel {
        background: #1e1e1e;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #333;
    }

    .panel h3 {
        margin-top: 0;
        color: #fff;
    }

    .timeline-entry {
        padding: 8px 12px;
        margin: 6px 0;
        border-left: 5px solid #666;
        background: #2a2a2a;
        border-radius: 4px;
        color: #ddd;
        font-size: 14px;
        line-height: 1.4em;
    }

    .sev-normal { border-color: #4caf50; }
    .sev-suspicious { border-color: #ff9800; }
    .sev-anomalous { border-color: #ff5722; }
    .sev-critical { border-color: #f44336; }

    .cluster-item, .dev-item, .chan-item {
        padding: 4px 0;
        color: #ccc;
        font-size: 14px;
    }

    .vendor-tag {
        color: #9ecbff;
        font-size: 12px;
    }

    .ssid-tag {
        color: #ffdf8f;
        font-size: 12px;
    }
</style>

<h1>ML Anomaly Dashboard</h1>
<p style="color:#bbb">Real‑time anomaly intelligence from the RF Observatory</p>

<div class="anomaly-container">

    <!-- Timeline -->
    <div class="panel">
        <h3>Anomaly Timeline</h3>
        <div id="anomaly-timeline">Loading…</div>
    </div>

    <!-- Cluster distribution -->
    <div class="panel">
        <h3>Anomaly Types</h3>
        <div id="cluster-distribution">Loading…</div>
    </div>

    <!-- Device deviation -->
    <div class="panel">
        <h3>Device Deviation</h3>
        <div id="device-deviation">Loading…</div>
    </div>

    <!-- Channel deviation -->
    <div class="panel">
        <h3>Channel Deviation</h3>
        <div id="channel-deviation">Loading…</div>
    </div>

</div>

<div class="panel">

<script>
try {
    const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/rule_alerts";
    const wsRules = new WebSocket(wsUrl);

    wsRules.onmessage = (ev) => {
        const a = JSON.parse(ev.data);
        const container = document.getElementById("rule-alerts");

        const div = document.createElement("div");
        div.className = "timeline-entry sev-" + (a.rule_severity || "normal");
        div.innerHTML = `
            <b>${a.timestamp}</b><br>
            Rule: <b>${a.rule_type}</b><br>
            ${a.rule_description}<br>
            MAC: ${a.src_mac || a.mac || "unknown"}<br>
            Ch ${a.channel}
        `;
        container.prepend(div);
    };
} catch (e) {
    console.warn("Rule WebSocket unavailable", e);
}
</script>

    <h3>Rule-Based Alerts</h3>
    <div id="rule-alerts">Listening…</div>
    
</div>

<script>
function severityClass(sev) {
    return {
        "normal": "sev-normal",
        "suspicious": "sev-suspicious",
        "anomalous": "sev-anomalous",
        "critical": "sev-critical"
    }[sev] || "";
}

function fetchAnomalies() {
    fetch("/api/anomalies/recent")
        .then(r => r.json())
        .then(data => {
            renderTimeline(data);
            renderClusterChart(data);
            renderDeviceDeviation(data);
            renderChannelDeviation(data);
        })
        .catch(err => {
            console.error("Failed to load anomalies:", err);
        });
}

function renderTimeline(data) {
    const container = document.getElementById("anomaly-timeline");
    container.innerHTML = "";

    if (!data.length) {
        container.innerHTML = "<i>No anomalies detected</i>";
        return;
    }

    data.forEach(a => container.appendChild(buildTimelineEntry(a)));
}

function buildTimelineEntry(a) {
    const div = document.createElement("div");
    div.className = "timeline-entry " + severityClass(a.anomaly_severity);

    const vendorInfo = a.src_vendor ? `<span class="vendor-tag">${a.src_vendor}</span>` : "";
    const bssidVendorInfo = a.bssid_vendor ? `<span class="vendor-tag">${a.bssid_vendor}</span>` : "";
    const ssidInfo = a.ssid ? `<span class="ssid-tag">${a.ssid}</span>` : "<span class='ssid-tag'>unknown</span>";

    div.innerHTML = `
        <b>${a.timestamp}</b><br>
        ${a.frame_type} — <b>${a.anomaly_severity}</b><br>
        Score: ${a.anomaly_score.toFixed(3)} (cluster: ${a.anomaly_cluster})<br>
        Src: ${a.src_mac || "?"} ${vendorInfo}<br>
        SSID: ${ssidInfo} / AP Vendor: ${bssidVendorInfo}<br>
        Ch ${a.channel}, dev: dev=${a.device_deviation.toFixed(3)}, ch=${a.channel_deviation.toFixed(3)}
    `;
    return div;
}

function renderClusterChart(data) {
    const container = document.getElementById("cluster-distribution");
    container.innerHTML = "";

    const counts = {};
    data.forEach(a => {
        counts[a.anomaly_cluster] = (counts[a.anomaly_cluster] || 0) + 1;
    });

    if (Object.keys(counts).length === 0) {
        container.innerHTML = "<i>No data</i>";
        return;
    }

    for (const [cluster, count] of Object.entries(counts)) {
        const div = document.createElement("div");
        div.className = "cluster-item";
        div.innerHTML = `${cluster}: <b>${count}</b>`;
        container.appendChild(div);
    }
}

function renderDeviceDeviation(data) {
    const container = document.getElementById("device-deviation");
    container.innerHTML = "";

    const devs = data
        .filter(a => a.device_deviation > 0.3)
        .sort((a, b) => b.device_deviation - a.device_deviation);

    if (!devs.length) {
        container.innerHTML = "<i>No significant deviations</i>";
        return;
    }

    devs.forEach(a => {
        const vendorInfo = a.src_vendor ? ` (${a.src_vendor})` : "";
        const div = document.createElement("div");
        div.className = "dev-item";
        div.innerHTML = `${a.src_mac}${vendorInfo}: <b>${a.device_deviation.toFixed(3)}</b>`;
        container.appendChild(div);
    });
}

function renderChannelDeviation(data) {
    const container = document.getElementById("channel-deviation");
    container.innerHTML = "";

    const chans = data
        .filter(a => a.channel_deviation > 0.3)
        .sort((a, b) => b.channel_deviation - a.channel_deviation);

    if (!chans.length) {
        container.innerHTML = "<i>No significant deviations</i>";
        return;
    }

    chans.forEach(a => {
        const div = document.createElement("div");
        div.className = "chan-item";
        div.innerHTML = `Ch ${a.channel}: <b>${a.channel_deviation.toFixed(3)}</b>`;
        container.appendChild(div);
    });
}

// Initial load
fetchAnomalies();

// Auto-refresh every 5 seconds
setInterval(fetchAnomalies, 5000);


// ---------------------------------------------------------------------------
// WebSocket live anomaly updates
// ---------------------------------------------------------------------------
try {
    const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/anomalies";
    const ws = new WebSocket(wsUrl);

    ws.onmessage = (ev) => {
        const a = JSON.parse(ev.data);
        console.log("Live anomaly", a);

        const container = document.getElementById("anomaly-timeline");
        const entry = buildTimelineEntry(a);

        // Prepend new anomaly to top of timeline
        container.prepend(entry);
    };

    ws.onerror = (err) => {
        console.warn("WebSocket error:", err);
    };
} catch (e) {
    console.warn("WebSocket not available", e);
}
</script>

{% endblock %}
