{% extends "base.html" %}
{% block content %}

<style>
    .panel {
        background: #1e1e1e;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #333;
        margin-bottom: 20px;
    }
    .panel h2, .panel h3 {
        margin-top: 0;
        color: #fff;
    }
    .device-item {
        padding: 6px 10px;
        margin: 4px 0;
        background: #2a2a2a;
        border-radius: 4px;
        color: #ddd;
        cursor: pointer;
    }
    .device-item:hover {
        background: #333;
    }
    .timeline-entry {
        padding: 4px 8px;
        margin: 3px 0;
        border-left: 4px solid #666;
        background: #2a2a2a;
        border-radius: 4px;
        color: #ddd;
        font-size: 13px;
    }
</style>

<h1>Device Behavior Dashboard</h1>
<p style="color:#bbb">Per-device anomaly behavior from the RF Observatory</p>

<div class="panel">
    <h2>Top Devices by Deviation</h2>
    <div id="device-list">Loading…</div>
</div>

<div class="panel">
    <h2>Selected Device Timeline</h2>
    <div id="device-selected" style="color:#aaa">No device selected</div>
    <div id="device-timeline"></div>
</div>

<script>
let currentDevice = null;

function loadTopDevices() {
    fetch("/api/devices/top_deviation")
        .then(r => r.json())
        .then(devs => {
            const container = document.getElementById("device-list");
            container.innerHTML = "";
            if (!devs.length) {
                container.innerHTML = "<i>No devices with significant deviation yet</i>";
                return;
            }
            devs.forEach(d => {
                const div = document.createElement("div");
                div.className = "device-item";
                div.innerHTML = `
                    <b>${d.src_mac}</b><br>
                    Max deviation: ${d.max_deviation.toFixed(3)} (samples: ${d.samples})
                `;
                div.onclick = () => {
                    currentDevice = d.src_mac;
                    document.getElementById("device-selected").innerText =
                        "Device: " + currentDevice;
                    loadDeviceTimeline(currentDevice);
                };
                container.appendChild(div);
            });
        })
        .catch(err => {
            console.error("Failed to load top devices:", err);
        });
}

function loadDeviceTimeline(mac) {
    fetch("/api/device/" + encodeURIComponent(mac) + "/timeline")
        .then(r => r.json())
        .then(events => {
            const container = document.getElementById("device-timeline");
            container.innerHTML = "";
            if (!events.length) {
                container.innerHTML = "<i>No anomaly history for this device</i>";
                return;
            }
            events.forEach(e => {
                const div = document.createElement("div");
                div.className = "timeline-entry";
                div.innerHTML = `
                    <b>${e.timestamp}</b> — ch ${e.channel} — ${e.frame_type}<br>
                    Severity: ${e.anomaly_severity}, score=${e.anomaly_score.toFixed(3)}, cluster=${e.anomaly_cluster}<br>
                    Dev: device=${e.device_deviation.toFixed(3)}, channel=${e.channel_deviation.toFixed(3)}
                `;
                container.appendChild(div);
            });
        })
        .catch(err => {
            console.error("Failed to load device timeline:", err);
        });
}

// Initial load
loadTopDevices();

// Optionally refresh list every 30s
setInterval(loadTopDevices, 30000);
</script>

{% endblock %}
