<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}RF Console{% endblock %}</title>

  {% block head_extras %}{% endblock %}

  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --text: #e6edf3;
      --subtext: #9ba3b4;
      --border: #30363d;
      --accent: #00e5ff;
      --accent-soft: #66f5ff;
      --accent-glow: rgba(0, 229, 255, 0.4);
      --danger: #ff4b6e;
      --ok: #00e676;
      --warn: #ffb74d;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background: #0b0f14;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.2em;
      box-shadow: 4px 0 12px rgba(0,0,0,0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6em;
      margin-bottom: 2em;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      background: radial-gradient(circle, var(--accent), transparent 60%);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .brand-title {
      font-size: 1.2em;
      color: var(--accent-soft);
      text-shadow: 0 0 10px var(--accent-glow);
      letter-spacing: 0.08em;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 0.6em;
    }

    nav a {
      padding: 0.6em 1em;
      border-radius: 8px;
      text-decoration: none;
      color: var(--subtext);
      transition: 0.2s;
      border: 1px solid transparent;
    }

    nav a:hover {
      color: var(--accent-soft);
      border-color: var(--accent-glow);
      background: rgba(0,229,255,0.05);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    nav a.active {
      color: var(--accent-soft);
      border-color: var(--accent);
      background: rgba(0,229,255,0.08);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    /* MAIN CONTENT */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 2em;
    }

    .page-title {
      margin-bottom: 1em;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.2em;
      margin-bottom: 1.2em;
      box-shadow: 0 0 12px rgba(0,0,0,0.4);
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 18px var(--accent-glow);
    }
  </style>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div class="sidebar">
    <div class="brand">
      <div class="brand-logo"></div>
      <div class="brand-title">RF Console</div>
    </div>

    <nav>
      <a href="/dashboard/observatory" class="{% if active_page == 'observatory' %}active{% endif %}">Observatory</a>
      <a href="/dashboard/frame-explorer" class="{% if active_page == 'frames' %}active{% endif %}">Frame Explorer</a>
      <a href="/dashboard/anomalies" class="{% if active_page == 'anomalies' %}active{% endif %}">Anomalies</a>
      <a href="/dashboard/sensors" class="{% if active_page == 'sensors' %}active{% endif %}">Sensors</a>
      <a href="/dashboard/system" class="{% if active_page == 'system' %}active{% endif %}">System</a>
      <a href="/dashboard/rover" class="{% if active_page == 'rover' %}active{% endif %}">Rover</a>
    </nav>
  </div>

  <div class="main">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
