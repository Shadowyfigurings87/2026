<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rover Mission Control</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>

<body>

<!-- TOP BAR -->
<div id="top-bar">

    <div id="mission-status">
        <span class="status-label">Status:</span>
        <span id="status-indicator">--</span>
    </div>

    <div id="operator-info">
        <span class="status-label">Operator:</span>
        <span id="operator-name">Not Logged In</span>
    </div>

    <div id="session-info">
        <span class="status-label">Session:</span>
        <span id="session-state">Inactive</span>
    </div>

</div>


<!-- SIDEBAR -->
<nav id="sidebar">
    <ul>
        <li onclick="openPanel('camera')">Camera</li>
        <li onclick="openPanel('telemetry')">Telemetry</li>
        <li onclick="openPanel('commands')">Commands</li>
        <li onclick="openPanel('rf')">RF</li>
        <li onclick="openPanel('system')">System</li>
        <li onclick="openPanel('events')">Events</li>
        <li onclick="openPanel('esp32')">ESP32</li>
    </ul>
</nav>

<!-- FLOATING WINDOW CONTAINER -->
<div id="window-area"></div>

<script src="/static/js/window_manager.js"></script>
<script src="/static/js/dashboard.js"></script>

</body>
</html>
