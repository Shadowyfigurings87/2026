<div id="rover-panel" class="commands-panel">

    <h2>Rover Command Panel</h2>

    <div id="status-line" class="command-status">
        Panel inactive. Click inside to arm controls.
    </div>

    <!-- Mode buttons -->
    <div class="command-modes">
        <button id="mode-crawl" class="drive-mode-btn">Crawl (1)</button>
        <button id="mode-cruise" class="drive-mode-btn">Cruise (2)</button>
        <button id="mode-boost" class="drive-mode-btn">Boost (3)</button>
    </div>

    <!-- Throttle -->
    <div class="command-throttle">
        <label for="throttle">Throttle:</label>
        <input id="throttle" type="range" min="0" max="255" value="0">
        <span id="command-throttle-value">0</span>

    </div>span

    <!-- Drive direction -->
    <div class="command-drive">
        <button id="btn-forward" class="control-btn">Forward (F)</button>
        <button id="btn-stop" class="control-btn stop-btn">Stop (Space)</button>
        <button id="btn-reverse" class="control-btn">Reverse (R)</button>
    </div>

    <!-- Steering -->
    <div class="command-steering">
        <button id="btn-dir-rev" class="control-btn">Steer Left (←)</button>
        <button id="btn-dir-fwd" class="control-btn">Steer Right (→)</button>
    </div>

</div>
