<h2>Telemetry</h2>

<div id="telemetry-grid">
    <div class="tile">RPM: <span id="rpm-value">--</span></div>
    <div class="tile">Throttle: <span id="throttle-value">--</span></div>
    <div class="tile">Direction: <span id="direction-value">--</span></div>
    <div class="tile">Voltage: <span id="voltage-value">--</span></div>
    <div class="tile">Temp: <span id="temp-value">--</span></div>
</div>

<h3>Telemetry Log</h3>
<div id="telemetry-log" class="log-box"></div>
