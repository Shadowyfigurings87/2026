<div id="gps-panel">
    <div id="gps-header">
        <div class="gps-title">GPS / Map</div>
        <div class="gps-meta">
            <span class="gps-label">Lat:</span>
            <span id="gps-lat">--</span>
            <span class="gps-label">Lon:</span>
            <span id="gps-lon">--</span>
            <span class="gps-label">Time:</span>
            <span id="gps-timestamp">--</span>
        </div>
    </div>

    <div id="gps-map-container">
        <div id="gps-map"></div>
    </div>
</div>
